<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Blocky Horde - Voxel Survival</title>
    <link rel="stylesheet" href="styles.css">
    <!-- Eruda: Mobile debugging console -->
    <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
    <script>
        // Initialize Eruda for mobile debugging
        // It provides a console panel that can be accessed by clicking the floating button
        // Position the button in the top-right corner, away from game UI
        eruda.init({
            container: document.body,
            tool: ['console', 'elements', 'network', 'resources', 'info', 'snippets', 'sources'],
            useShadowDom: true,
            autoScale: true,
            defaults: {
                displaySize: 50,
                transparency: 0.9,
                theme: 'Dark'
            }
        });

        // Move the entry button to top-right after initialization
        eruda.position({ x: window.innerWidth - 60, y: 10 });
    </script>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas"></canvas>

        <div id="ui">
            <div>
                <div class="stat">
                    <span class="stat-label">HP:</span>
                    <span id="hpValue">100</span>
                </div>
                <div id="healthBar">
                    <div id="healthFill" style="width: 100%"></div>
                </div>
            </div>
            <div>
                <div class="stat">
                    <span class="stat-label">TIME:</span>
                    <span id="timeValue">0:00</span>
                </div>
                <div class="stat">
                    <span class="stat-label">KILLS:</span>
                    <span id="killsValue">0</span>
                </div>
                <button id="audioToggle" class="audio-toggle" title="Toggle Sound">🔊</button>
            </div>
        </div>

        <div class="instructions desktop">
            WASD or Arrow Keys to Move | SPACE: Ghast Fireball | Survive!
        </div>

        <div class="instructions mobile" style="display: none;">
            Use Joystick to Move | TAP: Ghast Fireball | Survive!
        </div>

        <div id="abilityUI">
            <div class="ability-indicator">
                <div class="ability-icon" id="abilityButton">
                    <div id="abilityCooldown" class="cooldown-overlay"></div>
                    <span class="ability-key">SPECIAL</span>
                </div>
                <div class="ability-charges" id="abilityCharges">●</div>
            </div>
        </div>

        <div id="difficultyNotification" class="notification"></div>
        <div id="itemPickupNotification" class="item-pickup-notification"></div>

        <div id="touchControls">
            <div id="joystickBase">
                <div id="joystickStick"></div>
            </div>
        </div>

        <div id="gameOver">
            <h1>GAME OVER</h1>
            <p>Time Survived: <span id="finalTime">0:00</span></p>
            <p>Enemies Defeated: <span id="finalKills">0</span></p>
            <button>Play Again</button>
        </div>

        <!-- Special Upgrade UI (shown after boss defeat) -->
        <div id="specialUpgradeOverlay">
            <div id="specialUpgradePanel">
                <h2>BOSS DEFEATED!</h2>
                <p class="upgrade-subtitle">Choose your reward</p>
                <div id="specialOptions">
                    <!-- Options will be dynamically populated -->
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="main.js"></script>
</body>
</html>
