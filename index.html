<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Blocky Horde - Voxel Survival</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas"></canvas>

        <div id="ui">
            <div>
                <div class="stat">
                    <span class="stat-label">HP:</span>
                    <span id="hpValue">100</span>
                </div>
                <div id="healthBar">
                    <div id="healthFill" style="width: 100%"></div>
                </div>
            </div>
            <div>
                <div class="stat">
                    <span class="stat-label">TIME:</span>
                    <span id="timeValue">0:00</span>
                </div>
                <div class="stat">
                    <span class="stat-label">KILLS:</span>
                    <span id="killsValue">0</span>
                </div>
            </div>
        </div>

        <div class="instructions desktop">
            WASD or Arrow Keys to Move | Auto-Attack Active | Survive!
        </div>

        <div class="instructions mobile" style="display: none;">
            Use Joystick to Move | Auto-Attack Active | Survive!
        </div>

        <div id="touchControls">
            <div id="joystickBase">
                <div id="joystickStick"></div>
            </div>
        </div>

        <div id="gameOver">
            <h1>GAME OVER</h1>
            <p>Time Survived: <span id="finalTime">0:00</span></p>
            <p>Enemies Defeated: <span id="finalKills">0</span></p>
            <button>Play Again</button>
        </div>
    </div>

    <script type="module" src="game.js"></script>
</body>
</html>
