<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Blocky Horde - Voxel Survival</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', monospace;
            background: #1a1a1a;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            touch-action: none;
            -webkit-user-select: none;
            user-select: none;
        }

        #gameContainer {
            position: relative;
            width: 800px;
            height: 600px;
            border: 4px solid #333;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
        }

        #gameCanvas {
            width: 100%;
            height: 100%;
            background: #7cbd6e;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }

        #ui {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            padding: 15px;
            background: linear-gradient(180deg, rgba(0,0,0,0.7) 0%, rgba(0,0,0,0) 100%);
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            pointer-events: none;
            z-index: 10;
        }

        .stat {
            font-size: 18px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
            font-weight: bold;
        }

        .stat-label {
            color: #aaa;
            font-size: 14px;
        }

        #healthBar {
            width: 200px;
            height: 24px;
            background: #333;
            border: 2px solid #555;
            position: relative;
            margin-top: 5px;
        }

        #healthFill {
            height: 100%;
            background: linear-gradient(180deg, #ff4444 0%, #cc0000 100%);
            transition: width 0.3s ease;
            box-shadow: inset 0 2px 4px rgba(255, 255, 255, 0.3);
        }

        #gameOver {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.9);
            padding: 40px 60px;
            border: 4px solid #666;
            color: white;
            text-align: center;
            display: none;
            z-index: 20;
        }

        #gameOver h1 {
            font-size: 48px;
            color: #ff4444;
            margin-bottom: 20px;
            text-shadow: 3px 3px 6px rgba(0, 0, 0, 0.8);
        }

        #gameOver p {
            font-size: 24px;
            margin: 10px 0;
        }

        #gameOver button {
            margin-top: 20px;
            padding: 12px 30px;
            font-size: 18px;
            font-family: 'Courier New', monospace;
            background: #444;
            color: white;
            border: 2px solid #666;
            cursor: pointer;
            transition: all 0.2s;
        }

        #gameOver button:hover {
            background: #555;
            border-color: #888;
        }

        .instructions {
            position: absolute;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.7);
            font-size: 14px;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.8);
            text-align: center;
        }

        #touchControls {
            position: absolute;
            bottom: 20px;
            left: 20px;
            width: 150px;
            height: 150px;
            display: none;
            z-index: 15;
            pointer-events: all;
        }

        #joystickBase {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(100, 100, 100, 0.3), rgba(50, 50, 50, 0.5));
            border: 3px solid rgba(255, 255, 255, 0.3);
        }

        #joystickStick {
            position: absolute;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(200, 200, 200, 0.7), rgba(100, 100, 100, 0.7));
            border: 3px solid rgba(255, 255, 255, 0.5);
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            transition: all 0.1s ease-out;
        }

        @media (max-width: 850px) {
            #gameContainer {
                width: 100vw;
                height: 100vh;
                border: none;
            }

            .instructions.desktop {
                display: none;
            }

            #touchControls {
                display: block;
            }

            #ui {
                font-size: 14px;
            }

            .stat {
                font-size: 16px;
            }

            .stat-label {
                font-size: 12px;
            }

            #healthBar {
                width: 150px;
                height: 20px;
            }
        }

        @media (max-width: 500px) {
            #touchControls {
                width: 120px;
                height: 120px;
            }

            #joystickStick {
                width: 50px;
                height: 50px;
            }

            .instructions {
                font-size: 12px;
                bottom: 10px;
            }
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas"></canvas>

        <div id="ui">
            <div>
                <div class="stat">
                    <span class="stat-label">HP:</span>
                    <span id="hpValue">100</span>
                </div>
                <div id="healthBar">
                    <div id="healthFill" style="width: 100%"></div>
                </div>
            </div>
            <div>
                <div class="stat">
                    <span class="stat-label">TIME:</span>
                    <span id="timeValue">0:00</span>
                </div>
                <div class="stat">
                    <span class="stat-label">KILLS:</span>
                    <span id="killsValue">0</span>
                </div>
            </div>
        </div>

        <div class="instructions desktop">
            WASD or Arrow Keys to Move | Auto-Attack Active | Survive!
        </div>

        <div class="instructions mobile" style="display: none;">
            Use Joystick to Move | Auto-Attack Active | Survive!
        </div>

        <div id="touchControls">
            <div id="joystickBase">
                <div id="joystickStick"></div>
            </div>
        </div>

        <div id="gameOver">
            <h1>GAME OVER</h1>
            <p>Time Survived: <span id="finalTime">0:00</span></p>
            <p>Enemies Defeated: <span id="finalKills">0</span></p>
            <button onclick="location.reload()">Play Again</button>
        </div>
    </div>

    <script>
        // Game Configuration
        const CONFIG = {
            canvas: {
                width: 800,
                height: 600
            },
            player: {
                size: 32,
                speed: 200,
                maxHP: 100,
                color: '#f0c080'
            },
            enemy: {
                size: 28,
                speed: 80,
                damage: 10,
                damageInterval: 1000,
                initialSpawnInterval: 1500,
                color: '#80cc80'
            },
            projectile: {
                size: 8,
                speed: 300,
                interval: 500,
                color: '#ffff00'
            },
            difficulty: {
                intervalReduction: 0.1,
                timePerReduction: 30,
                // Aggressive scaling factors
                speedMultiplierPerMinute: 0.5,    // +50% speed per minute
                damageMultiplierPerMinute: 0.4,   // +40% damage per minute
                hpMultiplierPerMinute: 0.3        // +30% HP per minute
            }
        };

        // Canvas Setup
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        canvas.width = CONFIG.canvas.width;
        canvas.height = CONFIG.canvas.height;

        // Game State
        const gameState = {
            isRunning: false,
            isPaused: false,
            startTime: 0,
            currentTime: 0,
            kills: 0,
            lastUpdate: 0,
            keys: {},
            camera: { x: 0, y: 0 },
            touch: {
                active: false,
                dx: 0,
                dy: 0,
                startX: 0,
                startY: 0
            }
        };

        // Player
        const player = {
            x: CONFIG.canvas.width / 2,
            y: CONFIG.canvas.height / 2,
            worldX: 0,
            worldY: 0,
            vx: 0,
            vy: 0,
            hp: CONFIG.player.maxHP,
            lastDamageTime: 0
        };

        // Arrays for game entities
        const enemies = [];
        const projectiles = [];

        // Spawning
        let lastEnemySpawn = 0;
        let lastProjectileSpawn = 0;
        let currentSpawnInterval = CONFIG.enemy.initialSpawnInterval;

        // Difficulty multipliers (updated dynamically)
        let difficultyMultipliers = {
            speed: 1.0,
            damage: 1.0,
            hp: 1.0
        };

        // Input Handling
        document.addEventListener('keydown', (e) => {
            gameState.keys[e.key.toLowerCase()] = true;
        });

        document.addEventListener('keyup', (e) => {
            gameState.keys[e.key.toLowerCase()] = false;
        });

        // Touch Controls
        const joystickBase = document.getElementById('joystickBase');
        const joystickStick = document.getElementById('joystickStick');
        const maxJoystickDistance = 45; // Maximum distance the stick can move from center

        function handleTouchStart(e) {
            e.preventDefault();
            const touch = e.touches[0];
            const rect = joystickBase.getBoundingClientRect();

            gameState.touch.active = true;
            gameState.touch.startX = rect.left + rect.width / 2;
            gameState.touch.startY = rect.top + rect.height / 2;
        }

        function handleTouchMove(e) {
            e.preventDefault();
            if (!gameState.touch.active) return;

            const touch = e.touches[0];
            const deltaX = touch.clientX - gameState.touch.startX;
            const deltaY = touch.clientY - gameState.touch.startY;

            // Calculate distance from center
            const distance = Math.sqrt(deltaX * deltaX + deltaY * deltaY);

            // Limit the joystick movement
            let normalizedDX = deltaX;
            let normalizedDY = deltaY;

            if (distance > maxJoystickDistance) {
                const angle = Math.atan2(deltaY, deltaX);
                normalizedDX = Math.cos(angle) * maxJoystickDistance;
                normalizedDY = Math.sin(angle) * maxJoystickDistance;
            }

            // Update joystick visual position
            joystickStick.style.transform = `translate(calc(-50% + ${normalizedDX}px), calc(-50% + ${normalizedDY}px))`;

            // Update game state with normalized direction (-1 to 1)
            gameState.touch.dx = normalizedDX / maxJoystickDistance;
            gameState.touch.dy = normalizedDY / maxJoystickDistance;
        }

        function handleTouchEnd(e) {
            e.preventDefault();
            gameState.touch.active = false;
            gameState.touch.dx = 0;
            gameState.touch.dy = 0;

            // Reset joystick visual position
            joystickStick.style.transform = 'translate(-50%, -50%)';
        }

        // Add touch event listeners
        joystickBase.addEventListener('touchstart', handleTouchStart, { passive: false });
        joystickBase.addEventListener('touchmove', handleTouchMove, { passive: false });
        joystickBase.addEventListener('touchend', handleTouchEnd, { passive: false });
        joystickBase.addEventListener('touchcancel', handleTouchEnd, { passive: false });

        // Detect if device supports touch and show appropriate controls
        function detectTouchDevice() {
            const isTouchDevice = ('ontouchstart' in window) ||
                                  (navigator.maxTouchPoints > 0) ||
                                  (navigator.msMaxTouchPoints > 0);

            if (isTouchDevice || window.innerWidth <= 850) {
                document.getElementById('touchControls').style.display = 'block';
                document.querySelector('.instructions.desktop').style.display = 'none';
                document.querySelector('.instructions.mobile').style.display = 'block';
            }
        }

        // Call on load and resize
        detectTouchDevice();
        window.addEventListener('resize', detectTouchDevice);

        // Utility Functions
        function createVoxelTexture(ctx, x, y, size, baseColor) {
            // Create a simple voxel/block texture with shading
            const colors = {
                base: baseColor,
                light: adjustBrightness(baseColor, 40),
                dark: adjustBrightness(baseColor, -40),
                darkest: adjustBrightness(baseColor, -60)
            };

            // Main face
            ctx.fillStyle = colors.base;
            ctx.fillRect(x, y, size, size);

            // Add pixel detail pattern for texture
            ctx.fillStyle = colors.light;
            for (let i = 0; i < size; i += 4) {
                for (let j = 0; j < size; j += 4) {
                    if (Math.random() > 0.6) {
                        ctx.fillRect(x + i, y + j, 2, 2);
                    }
                }
            }

            // Top highlight
            ctx.fillStyle = colors.light;
            ctx.fillRect(x, y, size, 3);

            // Left highlight
            ctx.fillRect(x, y, 3, size);

            // Bottom shadow
            ctx.fillStyle = colors.dark;
            ctx.fillRect(x, y + size - 3, size, 3);

            // Right shadow
            ctx.fillRect(x + size - 3, y, 3, size);

            // Corner highlights
            ctx.fillStyle = colors.darkest;
            ctx.fillRect(x + size - 3, y + size - 3, 3, 3);
        }

        function adjustBrightness(color, amount) {
            // Parse hex color
            const num = parseInt(color.replace('#', ''), 16);
            let r = (num >> 16) + amount;
            let g = ((num >> 8) & 0x00FF) + amount;
            let b = (num & 0x0000FF) + amount;

            r = Math.max(0, Math.min(255, r));
            g = Math.max(0, Math.min(255, g));
            b = Math.max(0, Math.min(255, b));

            return '#' + ((r << 16) | (g << 8) | b).toString(16).padStart(6, '0');
        }

        function drawPlayer() {
            const screenX = player.worldX - gameState.camera.x;
            const screenY = player.worldY - gameState.camera.y;

            // Draw player as a voxel character head
            createVoxelTexture(ctx, screenX, screenY, CONFIG.player.size, CONFIG.player.color);

            // Add simple face details
            ctx.fillStyle = '#000';
            // Eyes
            ctx.fillRect(screenX + 8, screenY + 12, 4, 4);
            ctx.fillRect(screenX + 20, screenY + 12, 4, 4);
            // Mouth
            ctx.fillRect(screenX + 10, screenY + 22, 12, 2);
        }

        function drawEnemy(enemy) {
            const screenX = enemy.x - gameState.camera.x;
            const screenY = enemy.y - gameState.camera.y;

            // Only draw if on screen
            if (screenX < -50 || screenX > CONFIG.canvas.width + 50 ||
                screenY < -50 || screenY > CONFIG.canvas.height + 50) {
                return;
            }

            // Draw enemy as a zombie-like voxel
            createVoxelTexture(ctx, screenX, screenY, CONFIG.enemy.size, '#90cc90');

            // Add zombie face details
            ctx.fillStyle = '#000';
            // Eyes
            ctx.fillRect(screenX + 6, screenY + 10, 4, 4);
            ctx.fillRect(screenX + 18, screenY + 10, 4, 4);
            // Mouth
            ctx.fillStyle = '#333';
            ctx.fillRect(screenX + 8, screenY + 18, 12, 4);
        }

        function drawProjectile(proj) {
            const screenX = proj.x - gameState.camera.x;
            const screenY = proj.y - gameState.camera.y;

            // Draw projectile as a glowing pixel block
            ctx.fillStyle = '#ffff00';
            ctx.fillRect(screenX, screenY, CONFIG.projectile.size, CONFIG.projectile.size);

            // Add glow effect
            ctx.fillStyle = '#ffffaa';
            ctx.fillRect(screenX + 2, screenY + 2, 4, 4);

            // Outer glow
            ctx.strokeStyle = 'rgba(255, 255, 0, 0.3)';
            ctx.lineWidth = 2;
            ctx.strokeRect(screenX - 2, screenY - 2, CONFIG.projectile.size + 4, CONFIG.projectile.size + 4);
        }

        function drawBackground() {
            // Draw a tiled grass block pattern
            const tileSize = 40;
            const startX = Math.floor(gameState.camera.x / tileSize) * tileSize;
            const startY = Math.floor(gameState.camera.y / tileSize) * tileSize;

            for (let x = startX; x < startX + CONFIG.canvas.width + tileSize; x += tileSize) {
                for (let y = startY; y < startY + CONFIG.canvas.height + tileSize; y += tileSize) {
                    const screenX = x - gameState.camera.x;
                    const screenY = y - gameState.camera.y;

                    if (screenX > -tileSize && screenX < CONFIG.canvas.width &&
                        screenY > -tileSize && screenY < CONFIG.canvas.height) {

                        // Alternate grass colors for texture
                        const baseColor = ((x / tileSize + y / tileSize) % 2 === 0) ? '#7cbd6e' : '#6ead5f';
                        createVoxelTexture(ctx, screenX, screenY, tileSize, baseColor);
                    }
                }
            }
        }

        function updatePlayer(deltaTime) {
            // Update velocity based on input
            let dx = 0;
            let dy = 0;

            // Keyboard input
            if (gameState.keys['w'] || gameState.keys['arrowup']) dy -= 1;
            if (gameState.keys['s'] || gameState.keys['arrowdown']) dy += 1;
            if (gameState.keys['a'] || gameState.keys['arrowleft']) dx -= 1;
            if (gameState.keys['d'] || gameState.keys['arrowright']) dx += 1;

            // Touch input (overrides keyboard if active)
            if (gameState.touch.active) {
                dx = gameState.touch.dx;
                dy = gameState.touch.dy;
            }

            // Normalize diagonal movement (only if using keyboard)
            if (!gameState.touch.active && dx !== 0 && dy !== 0) {
                dx *= 0.707;
                dy *= 0.707;
            }

            // Update position
            player.worldX += dx * CONFIG.player.speed * deltaTime;
            player.worldY += dy * CONFIG.player.speed * deltaTime;

            // Update camera to follow player (player stays centered)
            gameState.camera.x = player.worldX - CONFIG.canvas.width / 2 + CONFIG.player.size / 2;
            gameState.camera.y = player.worldY - CONFIG.canvas.height / 2 + CONFIG.player.size / 2;

            // Player screen position is always centered
            player.x = CONFIG.canvas.width / 2;
            player.y = CONFIG.canvas.height / 2;
        }

        function spawnEnemy() {
            // Spawn enemy off-screen in a random direction
            const angle = Math.random() * Math.PI * 2;
            const distance = 400;

            // Apply HP multiplier based on difficulty
            const baseHP = 1;
            const scaledHP = Math.ceil(baseHP * difficultyMultipliers.hp);

            const enemy = {
                x: player.worldX + Math.cos(angle) * distance,
                y: player.worldY + Math.sin(angle) * distance,
                hp: scaledHP
            };

            enemies.push(enemy);
        }

        function updateEnemies(deltaTime) {
            for (let i = enemies.length - 1; i >= 0; i--) {
                const enemy = enemies[i];

                // Move toward player with difficulty-scaled speed
                const dx = player.worldX - enemy.x;
                const dy = player.worldY - enemy.y;
                const distance = Math.sqrt(dx * dx + dy * dy);

                if (distance > 0) {
                    const scaledSpeed = CONFIG.enemy.speed * difficultyMultipliers.speed;
                    enemy.x += (dx / distance) * scaledSpeed * deltaTime;
                    enemy.y += (dy / distance) * scaledSpeed * deltaTime;
                }

                // Check collision with player
                if (checkCollision(
                    enemy.x, enemy.y, CONFIG.enemy.size,
                    player.worldX, player.worldY, CONFIG.player.size
                )) {
                    // Damage player with difficulty-scaled damage
                    const now = Date.now();
                    if (now - player.lastDamageTime > CONFIG.enemy.damageInterval) {
                        const scaledDamage = Math.ceil(CONFIG.enemy.damage * difficultyMultipliers.damage);
                        player.hp -= scaledDamage;
                        player.lastDamageTime = now;
                        updateUI();

                        if (player.hp <= 0) {
                            gameOver();
                        }
                    }
                }
            }
        }

        function spawnProjectile() {
            // Find nearest enemy
            let nearestEnemy = null;
            let minDistance = Infinity;

            for (const enemy of enemies) {
                const dx = enemy.x - player.worldX;
                const dy = enemy.y - player.worldY;
                const distance = Math.sqrt(dx * dx + dy * dy);

                if (distance < minDistance) {
                    minDistance = distance;
                    nearestEnemy = enemy;
                }
            }

            // If no enemy, shoot in a random direction
            let angle = Math.random() * Math.PI * 2;

            if (nearestEnemy) {
                const dx = nearestEnemy.x - player.worldX;
                const dy = nearestEnemy.y - player.worldY;
                angle = Math.atan2(dy, dx);
            }

            const projectile = {
                x: player.worldX + CONFIG.player.size / 2,
                y: player.worldY + CONFIG.player.size / 2,
                vx: Math.cos(angle) * CONFIG.projectile.speed,
                vy: Math.sin(angle) * CONFIG.projectile.speed
            };

            projectiles.push(projectile);
        }

        function updateProjectiles(deltaTime) {
            for (let i = projectiles.length - 1; i >= 0; i--) {
                const proj = projectiles[i];

                proj.x += proj.vx * deltaTime;
                proj.y += proj.vy * deltaTime;

                // Remove if too far from player
                const dx = proj.x - player.worldX;
                const dy = proj.y - player.worldY;
                const distance = Math.sqrt(dx * dx + dy * dy);

                if (distance > 600) {
                    projectiles.splice(i, 1);
                    continue;
                }

                // Check collision with enemies
                for (let j = enemies.length - 1; j >= 0; j--) {
                    const enemy = enemies[j];
                    if (checkCollision(
                        proj.x, proj.y, CONFIG.projectile.size,
                        enemy.x, enemy.y, CONFIG.enemy.size
                    )) {
                        // Damage enemy
                        enemy.hp -= 1;

                        // Remove projectile
                        projectiles.splice(i, 1);

                        // Remove enemy if dead
                        if (enemy.hp <= 0) {
                            enemies.splice(j, 1);
                            gameState.kills++;
                            updateUI();
                        }
                        break;
                    }
                }
            }
        }

        function checkCollision(x1, y1, size1, x2, y2, size2) {
            return x1 < x2 + size2 &&
                   x1 + size1 > x2 &&
                   y1 < y2 + size2 &&
                   y1 + size1 > y2;
        }

        function updateDifficulty() {
            const timeInSeconds = (gameState.currentTime - gameState.startTime) / 1000;
            const timeInMinutes = timeInSeconds / 60;
            const difficultyLevel = Math.floor(timeInSeconds / CONFIG.difficulty.timePerReduction);

            // Calculate multipliers based on time (exponential growth at 5 min mark)
            difficultyMultipliers.speed = 1.0 + (timeInMinutes * CONFIG.difficulty.speedMultiplierPerMinute);
            difficultyMultipliers.damage = 1.0 + (timeInMinutes * CONFIG.difficulty.damageMultiplierPerMinute);
            difficultyMultipliers.hp = 1.0 + (timeInMinutes * CONFIG.difficulty.hpMultiplierPerMinute);

            // Extremely aggressive spawn rate scaling (quadratic after 3 minutes)
            // At 5 min: ~150ms spawn interval (6-7 enemies/sec)
            let spawnReduction;
            if (timeInMinutes <= 3) {
                spawnReduction = difficultyLevel * 50; // Linear for first 3 min
            } else {
                // Quadratic scaling after 3 min
                const excessTime = timeInMinutes - 3;
                spawnReduction = (6 * 50) + (excessTime * excessTime * 200);
            }

            currentSpawnInterval = Math.max(
                100,  // Extreme minimum: 10 enemies/sec
                CONFIG.enemy.initialSpawnInterval - spawnReduction
            );
        }

        function updateUI() {
            // Update HP
            document.getElementById('hpValue').textContent = Math.max(0, Math.floor(player.hp));
            const hpPercent = Math.max(0, (player.hp / CONFIG.player.maxHP) * 100);
            document.getElementById('healthFill').style.width = hpPercent + '%';

            // Update time
            const timeInSeconds = Math.floor((gameState.currentTime - gameState.startTime) / 1000);
            const minutes = Math.floor(timeInSeconds / 60);
            const seconds = timeInSeconds % 60;
            document.getElementById('timeValue').textContent =
                `${minutes}:${seconds.toString().padStart(2, '0')}`;

            // Update kills
            document.getElementById('killsValue').textContent = gameState.kills;
        }

        function gameOver() {
            gameState.isRunning = false;

            const timeInSeconds = Math.floor((gameState.currentTime - gameState.startTime) / 1000);
            const minutes = Math.floor(timeInSeconds / 60);
            const seconds = timeInSeconds % 60;

            document.getElementById('finalTime').textContent =
                `${minutes}:${seconds.toString().padStart(2, '0')}`;
            document.getElementById('finalKills').textContent = gameState.kills;
            document.getElementById('gameOver').style.display = 'block';
        }

        function gameLoop(timestamp) {
            if (!gameState.isRunning) return;

            const deltaTime = Math.min((timestamp - gameState.lastUpdate) / 1000, 0.1);
            gameState.lastUpdate = timestamp;
            gameState.currentTime = timestamp;

            // Update game logic
            updatePlayer(deltaTime);
            updateEnemies(deltaTime);
            updateProjectiles(deltaTime);
            updateDifficulty();

            // Spawn enemies
            if (timestamp - lastEnemySpawn > currentSpawnInterval) {
                spawnEnemy();
                lastEnemySpawn = timestamp;
            }

            // Spawn projectiles
            if (timestamp - lastProjectileSpawn > CONFIG.projectile.interval) {
                spawnProjectile();
                lastProjectileSpawn = timestamp;
            }

            // Render
            ctx.clearRect(0, 0, CONFIG.canvas.width, CONFIG.canvas.height);
            drawBackground();

            // Draw all entities
            enemies.forEach(drawEnemy);
            projectiles.forEach(drawProjectile);
            drawPlayer();

            // Update UI
            updateUI();

            // Continue loop
            requestAnimationFrame(gameLoop);
        }

        // Start the game
        function startGame() {
            gameState.isRunning = true;
            gameState.startTime = performance.now();
            gameState.lastUpdate = performance.now();
            gameState.currentTime = performance.now();

            lastEnemySpawn = performance.now();
            lastProjectileSpawn = performance.now();

            requestAnimationFrame(gameLoop);
        }

        // Initialize game
        startGame();
    </script>
</body>
